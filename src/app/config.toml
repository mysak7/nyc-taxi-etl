# Defaulty. Přebíjí se env proměnnými (APP_<KLIC>) a pak CLI flagy.
# Prahy jsou odvozené z naměřeného baselínu na 2025-01, ne odhadnuté -- viz README.

url_template = "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{year:04d}-{month:02d}.parquet"
zones_url = "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"

raw_uri = "./data/raw"
curated_uri = "./data/curated"
rejects_uri = "./data/rejects"

# Zdroj publikuje s lagem 26-85 dní a přepisuje zpětně (2026-03-25 přepsal tři měsíce
# naráz). Okno musí pokrýt obojí, jinak se restatement nikdy nezpracuje.
lookback_months = 6

# Nejnovější publikovaný měsíc starší než tohle = zdroj přestal publikovat.
# Naměřené maximum lagu je 85 dní.
source_stale_days = 120

# Hranice věrohodnosti měření. Vadná hodnota se nuluje, řádek zůstává.
#
# Vzdálenost se nechytá magnitudou, ale implikovanou rychlostí. Magnituda dělala v
# 2025-01 obojí špatně naráz: minula 136 rozbitých jízd pod prahem (165,91 mil za 11,4
# minuty za 17,70 $) a vynulovala 2 reálné dálkové (206 a 225 mil při 53-59 mph za 220
# a 400 $). Ze 122 jízd nad 200 mil jich 118 poruší i rychlost, takže o záchyt nejdeme.
# U 93 % řádků nad 100 mph sedí jízdné na dobu, ne na vzdálenost -> rozbitý je tachometr,
# proto se nuluje `trip_distance`. Nejrychlejší věrohodná jízda má 62 mph.
max_speed_mph = 100.0
# Záložní magnituda pro řádky, kde rychlost nespočítám (doba <= 1 min; takových je
# 38 420 a nejdelší z nich má 38 mil). Nejdelší věrohodná jízda v 2025-01 má 265,9 mil,
# nejkratší nesmysl 669,54.
max_distance_mi = 300.0
# Práh 360 min nuloval 7 jízd s věrohodnou rychlostí (84,42 mil za 6,6 h za 484,60 $),
# nad 480 min zbývají 3. Objem záchytu to nemění: 1203 -> 1135 řádků.
max_duration_min = 480.0

# Tvrdé prahy běhu. Naměřeno: karanténa 0,0006 %, storna 1,81 %, největší skok objemu
# mezi měsíci +21,9 % (29 měsíců), vynulovaná vzdálenost 2,53 %, doba 0,09 %.
#
# Karanténa je od oddělení storn skoro prázdná (22 řádků z 3,48 M = jízdy z prosince
# a února v lednovém souboru). Práh 0,20 dával smysl, dokud v ní ležela 1,83 % storn;
# teď by neznamenal nic. 0,05 je pořád 80x nad naměřeným, ale spadne dřív, než by
# rozbité `tpep_pickup_datetime` odneslo půlku měsíce. POZOR: naměřeno jen na 2025-01,
# ostatní měsíce lokálně nejsou -- po prvním backfillu přes historii přeměřit.
max_reject_ratio = 0.05
# Storna: 1,81 % celkem, ale 2,32 % uvnitř Vendora 2, který je jako jediný posílá.
# Práh sedí na vendor mixu, ne na kvalitě dat -- 0,08 unese i to, že Vendor 2 pobere
# celý trh, a pořád chytne skok, který by znamenal změnu praxe u dodavatele.
max_reversal_ratio = 0.08
max_volume_delta = 0.40
max_null_ratio_distance = 0.10
max_null_ratio_duration = 0.05
