[project]
name = "nyc-taxi-etl"
version = "0.1.0"
description = "ETL nad NYC Yellow Taxi Trip Records: denní agregace po zónách"
requires-python = ">=3.12"
dependencies = ["polars>=1.20", "httpx>=0.27"]

[project.optional-dependencies]
# Jen pro nasazení na Lambdu; lokálně ani v testech není potřeba.
lambda = ["awslambdaric>=3.0", "boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Airflow je ~200 MB a slouží jen k import testu DAGu -- do image nepatří.
airflow = ["apache-airflow>=3.0", "apache-airflow-providers-amazon>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Explicitní výběr pravidel, aby CI nezáviselo na globální konfiguraci stroje.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B"]
